[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kohakusshmanager"
version = "0.1.0"
description = "Small internal panel for managing Unix accounts and SSH public-key access on a handful of machines."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Kohaku", email = "kohaku@kblueleaf.net" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "peewee>=3.17",
    "paramiko>=3.4",
    "pydantic>=2.6",
    "cryptography>=42.0",
    "bcrypt>=4.1",
    "loguru>=0.7",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "black>=24.0",
    "ruff>=0.4",
]

[project.scripts]
kohakusshmanager = "kohakusshmanager.app:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kohakusshmanager = ["web_dist/**/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff.lint]
select = ["F401", "F841"]

[tool.black]
line-length = 88
